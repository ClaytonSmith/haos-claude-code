---
name: Claude Code
version: "0.6.0"
slug: claude_code
description: An Ubuntu dev container running Claude Code, with a terminal in the Home Assistant sidebar
url: "https://github.com/ClaytonSmith/haos-claude-code/tree/main/claude-code"
image: ghcr.io/claytonsmith/haos-claude-code-{arch}
arch:
  - aarch64
  - amd64
startup: application
boot: manual
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: Claude Code
# Makes Supervisor inject a scoped, self-rotating SUPERVISOR_TOKEN, so talking to
# the HA API needs no long-lived access token stored anywhere.
homeassistant_api: true
# Supervisor API access, so the container can build and install add-ons in
# /local_apps and manage itself. `manager` is the LOWEST role whose allowlist
# includes /store.* and /addons/<slug>/... — verified against Supervisor
# 2026.07.5's role table in api/middleware/security.py.
#
# Know what this costs: the same role also covers /host/.+, /os/..., /network/.+,
# /mounts.* and /backups.*, so it includes rebooting or shutting down the host.
# There is no finer-grained role between `backup` and `manager`.
#
# Deliberately NOT docker_api or full_access: both are gated on protection mode
# being switched off (docker/app.py), and this reaches the same goal with
# protection left ON.
hassio_api: true
hassio_role: manager
# The generated AppArmor profile is tuned for single-purpose add-ons and denies
# things a general dev container legitimately needs (compilers, package managers).
apparmor: false
ports:
  7681/tcp: null
ports_description:
  7681/tcp: Direct web-terminal access that BYPASSES Home Assistant auth. Leave empty unless you need it.
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  # Renamed from addon_config in Supervisor 2026.07. The legacy name still works
  # but logs a deprecation warning; the host dir is /app_configs/<slug>.
  - type: app_config
    read_only: false
    path: /app_config
  - type: share
    read_only: false
    path: /share
  - type: ssl
    read_only: true
    path: /ssl
  - type: local_apps
    read_only: false
    path: /local_apps
options:
  extra_packages: []
  git_user_name: ""
  git_user_email: ""
  anthropic_api_key: ""
  # Cloned into /data/workspace on every start and used as the shell's working
  # directory. Defaults to this add-on's own source so the agent can read the
  # CLAUDE.md written for it. Set to "" to disable and start in $HOME instead.
  workspace_repo: "https://github.com/ClaytonSmith/haos-claude-code"
  # Run in the tmux session on every start, from workspace_repo's checkout.
  # --name is fixed rather than left to default, because the default is derived
  # from the hostname — here the slug-based "1dedd3a9-claude-code", which changes
  # if the add-on is ever reinstalled under a new repository slug. A stable name
  # keeps the same entry in claude.ai/code across restarts and reinstalls.
  # Set to "" to boot into a plain shell instead.
  autostart_command: "claude remote-control --name haos"
  # house-dispatch: an HTTP endpoint on the internal add-on network that runs
  # `claude -p` for other services. See claude-code/dispatch/README.md.
  dispatch_enabled: true
schema:
  extra_packages:
    - str
  git_user_name: str?
  git_user_email: str?
  anthropic_api_key: password?
  workspace_repo: str?
  autostart_command: str?
  dispatch_enabled: bool
