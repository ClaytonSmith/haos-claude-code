name: Build

on:
  push:
    branches: [main]
    paths:
      - "claude-code/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per arch — cross-building Ubuntu + npm under QEMU is
          # slow enough to be its own problem.
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and version
        id: meta
        run: |
          version="$(grep -oP '^version:\s*"\K[^"]+' claude-code/config.yaml)"
          if [[ -z "${version}" ]]; then
            echo "::error::could not parse version from claude-code/config.yaml"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/haos-claude-code-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./claude-code
          platforms: ${{ matrix.platform }}
          push: true
          # Supervisor pulls a plain single-arch image; provenance attestations
          # would wrap it in a manifest list it does not expect.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
